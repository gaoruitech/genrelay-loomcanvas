services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/loomcanvas
      # Refuses to start when empty: set it in .env
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # Empty is fine: files are addressed relative to whatever address the app is opened at.
      # Set it to the public address when an upstream has to download reference files from here.
      PUBLIC_URL: ${PUBLIC_URL:-}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      # Storage is normally set in the app, under Settings > Storage; what is saved there overrides
      # these. They are the default of an instance on which nothing was saved yet. See docs/storage.md.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Always used, also after a switch to S3: files stored before the switch stay in this volume.
      STORAGE_LOCAL_DIR: /app/data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_DELIVERY: ${S3_DELIVERY:-}
      S3_ACL: ${S3_ACL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SSRF_ALLOW_HOSTS: ${SSRF_ALLOW_HOSTS:-}
      # Path of a billing hook module inside the container (mount the file, e.g. into /app/data).
      BILLING_HOOK: ${BILLING_HOOK:-}
      WEB_DIST: /app/web-dist
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app_data:/app/data
    # On stop the server puts in-flight runs back in the queue; it gives itself 20 seconds for that.
    stop_grace_period: 30s

volumes:
  mongo_data:
  app_data:
