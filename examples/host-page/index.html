<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Acme Studio (host page example)</title>

  <!-- LoomCanvas' stylesheet. Every rule in it is confined to the mount root (.lc-root). -->
  <link rel="stylesheet" href="/lib/app.css" />
  <!-- Optional: the three fonts LoomCanvas is designed with. Leave out to use system fonts. -->
  <link rel="stylesheet" href="/lib/fonts.css" />

  <!-- The host's own look, written carelessly on purpose: element selectors, a big base font,
       content-box everywhere. LoomCanvas must not be affected by it, nor affect it. -->
  <style>
    * { box-sizing: content-box; }
    html { font-size: 20px; }
    body { margin: 0; font: 20px/1.5 Georgia, 'Times New Roman', serif; color: #2b1d0e; background: #fbf6ee; }
    a { color: red; }
    button { all: revert; }
    h1, h2, p { margin: 0 0 12px; }
    ul { padding-left: 40px; }
    .acme-header { background: #b3261e; color: #fff; padding: 18px 32px; display: flex; align-items: center; gap: 24px; }
    .acme-header h1 { margin: 0; font-size: 28px; font-style: italic; }
    .acme-nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .acme-main { padding: 28px 32px 400px; }
    .acme-box { width: 1000px; max-width: 100%; height: 640px; margin: 24px 0 24px 60px; border: 3px solid #b3261e; }
    .acme-box.narrow { width: 520px; height: 560px; }
    .acme-login { max-width: 420px; padding: 20px; border: 1px solid #c9b79c; background: #fff; }
    .acme-login label { display: block; margin: 8px 0; }
    .acme-log { font: 13px/1.5 Consolas, monospace; background: #fff; border: 1px solid #c9b79c; padding: 10px; height: 150px; overflow: auto; white-space: pre-wrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="acme-header">
    <h1 id="acme-title">Acme Studio</h1>
    <nav class="acme-nav" id="acme-nav" hidden>
      <button data-go="canvases">Boards</button>
      <button data-go="assets">Assets</button>
      <button data-go="models" title="Not in the allow-list of this page: nothing happens">Models (not allowed)</button>
      <!-- Which LoomCanvas space the embedded app works in: the host decides (`space` option), there is no switcher inside. -->
      <label>Space <select id="acme-space"><option value="personal">Personal</option></select></label>
      <button id="acme-theme">Theme: dark</button>
      <button id="acme-locale">Language: en</button>
      <button id="acme-narrow">Narrow box</button>
      <button id="acme-second">Second instance</button>
      <button id="acme-expire">Expire my session</button>
      <button id="acme-logout">Sign out</button>
    </nav>
  </header>

  <main class="acme-main">
    <p id="acme-intro">This is the host's own page: its header, its fonts, its <a href="#" id="acme-link">red links</a>. LoomCanvas is mounted in the box below, without its own top bar and sidebar.</p>

    <!-- The host's sign-in. LoomCanvas' sign-in page is never shown. -->
    <form class="acme-login" id="acme-login">
      <h2>Sign in to Acme</h2>
      <label>User <input id="acme-user" value="admin" autocomplete="username" /></label>
      <label>Password <input id="acme-pass" type="password" autocomplete="current-password" /></label>
      <button type="submit" id="acme-submit">Sign in</button>
      <p id="acme-login-msg" style="color:#b3261e"></p>
    </form>

    <div class="acme-box" id="acme-canvas" hidden></div>
    <div class="acme-box" id="acme-canvas-2" hidden></div>

    <h2>Events</h2>
    <div class="acme-log" id="acme-log"></div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
