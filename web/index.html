<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LoomCanvas</title>
    <meta name="theme-color" content="#151517" />

    <!-- 主题预设：必须内联、且排在所有样式之前，否则深色用户每次刷新都会先闪一帧亮色。
         逻辑要和 src/stores/app.ts 保持一致。 -->
    <script>
      (function () {
        var t = "dark";
        try {
          var saved = localStorage.getItem("loomcanvas-theme");
          if (saved === "light" || saved === "dark") t = saved;
          else if (saved === "system")
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        var d = document.documentElement;
        d.setAttribute("data-theme", t);
        d.setAttribute("theme-mode", t);
      })();
    </script>
    <style>
      .app-splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #151517; z-index: 9999;
      }
      html[data-theme="light"] .app-splash { background: #f9fafa; }
      .app-splash__spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid #313137; border-top-color: #c3f53c;
        animation: app-spin .8s linear infinite;
      }
      html[data-theme="light"] .app-splash__spinner {
        border-color: #e1e4e3; border-top-color: #2d7259;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-splash"><div class="app-splash__spinner"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
