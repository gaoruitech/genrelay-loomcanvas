<!DOCTYPE html>
<html lang="en" theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LoomCanvas</title>
    <meta name="theme-color" content="#050a1e" />
    <meta name="color-scheme" content="dark" />
    <!-- 只有一套深色主题：theme-mode 写死在 <html> 上（TDesign 的组件认它），不需要内联脚本 -->
    <style>
      html { background: #050a1e; }
      .app-splash {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #050a1e; z-index: 9999;
      }
      .app-splash__spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(124, 160, 255, .2); border-top-color: #3fd8ff;
        animation: app-spin .8s linear infinite;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-splash"><div class="app-splash__spinner"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
